<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>tenkyu Rest Lab グラフ</title>
<style>
body{font-family:system-ui,sans-serif;margin:1rem auto;padding:0 .75rem;max-width:75rem;color:#182230}
label{display:block;margin:.7rem 0} canvas{width:100%;height:auto;display:block}
table{border-collapse:collapse;font-size:.85rem} th,td{border-bottom:1px solid #d4dce5;padding:.4rem;text-align:left;white-space:nowrap}
.panel{overflow:auto} #status{white-space:pre-wrap}
</style>
<h1>tenkyu Rest Lab グラフ</h1>
<label>センサー CSV（-raw.csv） <input id="raw" type="file" accept=".csv"></label>
<label>判定 CSV（-out.csv） <input id="out" type="file" accept=".csv"></label>
<p>安静度：5＝夜の睡眠相当、4＝居眠り・腕を机に置く、3＝集中したデスクワーク、2＝日常生活活動、1＝歩行・階段、0＝走行・運動。睡眠状態の確定判定ではありません。</p>
<p>温度判定版は置いた前後の温度変化と、3軸加速度・心拍測定を照合します。旧版の記録は当時の方式で再生します。</p>
<label>候補：揺れ上限 [g] <input id="noise" type="number" value="0.03" min="0.001" max="1" step="0.001"></label>
<label>候補：姿勢変動RMS上限 [g] <input id="drift" type="number" value="0.025" min="0.001" max="1" step="0.001"></label>
<label>温度変化の下限 [℃] <input id="thermal" type="number" value="0.20" min="0.05" max="3" step="0.05"></label>
<p id="status" role="status">同じ計測回のCSVを選択してください。ファイルは端末内で読み込みます。</p>
<canvas id="plot" width="1000" height="855" hidden aria-label="加速度、心拍信頼度、温度・変化率、安静度と装着判定の時系列"></canvas>
<div class="panel"><table id="details"></table></div>
<script src="candidate.js"></script>
<script src="rest.js"></script>
<script>
"use strict";
const raw = document.getElementById("raw"), out = document.getElementById("out");
const canvas = document.getElementById("plot"), status = document.getElementById("status");
const table = document.getElementById("details"), ctx = canvas.getContext("2d");
let sixScale=false;
const stageOf=n=>sixScale?Math.max(0,Math.min(5,Math.round(n/20))):Math.floor(Math.min(99,n)/20)+1;
const label = n => n===254?"非装着":n===253?"HRM失敗":n===255?"データ不足":
  n>=101&&n<=201?"充電 "+(n-101)+"%":"安静"+stageOf(n);
const date = ms => new Date(ms).toLocaleTimeString("ja-JP");
function rows(text, header) {
  const lines = text.trim().split(/\r?\n/);
  if (!lines[0] || !lines[0].startsWith(header)) throw Error("CSVの種類を確認してください。");
  return lines.slice(1).filter(Boolean).map(line => line.split(","));
}
let loadedFile;
async function redraw() {
  const a=raw.files[0], b=out.files[0];
  canvas.hidden=true;table.replaceChildren();
  if (!a || !b) return;
  try {
    if (a.name.replace(/-raw.*\.csv$/i,"")!==b.name.replace(/-out.*\.csv$/i,""))
      throw Error("同じ計測回のCSVを選択してください。");
    const samples=rows(await a.text(),"time_ms,type,");
    const results=rows(await b.text(),"start_ms,end_ms,");
    const profileRow=samples.find(r=>r[1]==="profile");
    const profile=profileRow?JSON.parse(decodeURIComponent(profileRow[2])):{};
    const thermal=profile.restThermalVersion===1, tempInput=document.getElementById("thermal");
    tempInput.disabled=!thermal;
    if(loadedFile!==a){
      tempInput.value=profile.restTempDeltaC||0.20;
      document.getElementById("noise").value=profile.restWearNoiseG||0.03;
      document.getElementById("drift").value=profile.restWearDriftG||0.025;loadedFile=a;
    }
    profile.restWearNoiseG=+document.getElementById("noise").value;
    profile.restWearDriftG=+document.getElementById("drift").value;
    sixScale=profile.restScaleVersion>=6;
    profile.restTempDeltaC=+tempInput.value;
    // Files before Lab 0.06 used the acceleration/HR classifier at all hours.
    if(!thermal && profile.restSleepGuard===undefined)profile.restSleepGuard=false;
    const trial=thermal?TenkyuRest.wearTracker(profile,undefined,profile.restSamplingVersion!==2):RestLabCandidate.create(profile), comparison=[];
    const loggedTicks=thermal&&samples.some(r=>r[1]==="check");
    const ordered=samples.filter(r=>["accel","hrm","charging","temperature","probe","probe_off","hr_error","check"].includes(r[1])).sort((a,b)=>+a[0]-b[0]);
    let nextAccel=0;
    let next=ordered.length?Math.ceil(+ordered[0][0]/10000)*10000:0;
    ordered.forEach(r=>{
      const ms=+r[0];
      while(!loggedTicks&&next<=ms){comparison.push(trial.result(next));next+=10000;}
      if(r[1]==="accel"&&(!profile.restEco||ms>=nextAccel)){
        nextAccel=nextAccel&&ms-nextAccel<=200?nextAccel+200:ms+200;
        trial.sample({x:+r[2],y:+r[3],z:+r[4]},ms);
      }
      if(r[1]==="hrm")trial.hrm({bpm:+r[5],confidence:+r[6]},ms);
      if(r[1]==="charging")trial.setCharging(!!(+r[2]),ms);
      if(thermal){
        if(r[1]==="temperature" && r[7])trial.temperature(+r[7],ms);
        if(r[1]==="probe"||r[1]==="probe_off")trial.probeDone(+r[8],ms,r[1]==="probe_off");
        if(r[1]==="hr_error")trial.setError(+r[8]!==0);
        if(r[1]==="check")comparison.push(trial.result(ms));
      }
    });
    if(ordered.length)comparison.push(trial.result(+ordered.at(-1)[0]));
    if (raw.files[0]!==a || out.files[0]!==b) return;
    const bins=new Map();
    results.forEach(r=>bins.set(+r[0],r)); // Use the newest revision for each interval.
    const decisions=[...bins.values()].sort((a,b)=>a[0]-b[0]);
    const signals=samples.filter(r=>(r[1]==="accel"||r[1]==="hrm")&&Number.isFinite(+r[0]));
    if (!signals.length) throw Error("センサーデータがありません。");
    const first=Math.min(+signals[0][0],decisions.length?+decisions[0][0]:Infinity);
    const end=Math.max(+signals[signals.length-1][0],decisions.length?+decisions.at(-1)[1]:0,first+1);
    const left=120,right=978,w=right-left;
    const x=t=>left+(t-first)*w/(end-first);
    const accel=signals.filter(r=>r[1]==="accel");
    const hrm=signals.filter(r=>r[1]==="hrm");
    canvas.height=thermal?1140:855;ctx.fillStyle="white";ctx.fillRect(0,0,1000,canvas.height);
    ctx.font="16px system-ui";
    function axis(top,title,ticks,y) {
      ctx.fillStyle="#182230";ctx.fillText(title,left,top-10);
      ticks.forEach(t=>{
        ctx.fillStyle="#536577";ctx.fillText(t,8,y(t)+5);
        ctx.fillStyle="#e1e7ee";ctx.fillRect(left,y(t),w,1);
      });
    }
    const max=accel.reduce((m,r)=>Math.max(m,Math.abs(+r[2]),Math.abs(+r[3]),Math.abs(+r[4])),1);
    const ay=v=>125-v*87/max;
    axis(38,"3軸加速度 [g]   X 赤   Y 緑   Z 青",[-max,0,max].map(v=>+v.toFixed(2)),ay);
    ["#b32e2e","#148153","#2a57b6"].forEach((color,k)=>{
      const lo=new Float64Array(w+1).fill(Infinity), hi=new Float64Array(w+1).fill(-Infinity);
      accel.forEach(r=>{const p=Math.floor(x(+r[0]))-left,v=+r[k+2];lo[p]=Math.min(lo[p],v);hi[p]=Math.max(hi[p],v);});
      ctx.fillStyle=color;
      lo.forEach((v,i)=>{if(Number.isFinite(v))ctx.fillRect(left+i,ay(hi[i]),1,Math.max(1,ay(v)-ay(hi[i])));});
    });
    const hy=v=>355-v*105/100;
    axis(250,"心拍信頼度 [%]   点がない区間は心拍イベントなし",[0,50,100],hy);
    ctx.fillStyle="#7640a9";
    hrm.forEach(r=>ctx.fillRect(x(+r[0]),hy(+r[6]),2,2));
    const sy=v=>500-v*17;
    axis(390,"安静度・非装着    非装着＝青    HRM失敗＝赤    充電＝紫",[0,1,2,3,4,5],sy);
    decisions.forEach(r=>{
      const v=+r[2], stage=stageOf(v);
      if(v===255)return;
      ctx.fillStyle=v===254?"#2a57b6":v===253?"#b32e2e":v>100?"#7640a9":"#148153";
      ctx.fillRect(x(+r[0]),v>100?505:sy(stage),Math.max(1,x(+r[1])-x(+r[0])),4);
    });
    ctx.fillStyle="#182230";ctx.font="14px system-ui";
    for(let i=0;i<=4;i++)ctx.fillText(date(first+(end-first)*i/4),left+w*i/4-23,539);
    const states=["motion","still_pulse","off_candidate","hr_uncertain","hr_missing","insufficient","charging","hr_error","wear_held","wear_uncertain"];
    const names=["動きあり","静止・脈あり",thermal?"非装着":"非装着候補","HR判定保留","HR不足","加速度不足","充電","HR電源エラー",thermal?"装着を保持":"夜間装着保持",thermal?"判定保留":"夜間判定保留"];
    const colors=["#c77720","#148153","#2a57b6","#7640a9","#b32e2e","#888888","#cc3388","#b32e2e","#148153","#7640a9"];
    ctx.font="15px system-ui";ctx.fillText("非装着方式：60秒窓 / 10秒更新",left,574);
    names.forEach((name,i)=>{ctx.fillStyle=colors[i];ctx.fillText(name,4,600+i*21);});
    comparison.forEach((r,i)=>{
      const j=states.indexOf(r.state);ctx.fillStyle=colors[j];
      ctx.fillRect(x(r.time),590+j*21,Math.max(2,x(i+1<comparison.length?comparison[i+1].time:r.time)-x(r.time)),5);
    });
    ctx.fillStyle="#182230";ctx.fillText("上段＝現行5分判定、下段＝記録から再計算した候補判定。最終未完了枠は未確定。",left,840);
    if(thermal){
      const temperatures=ordered.filter(r=>r[1]==="temperature"&&r[7]&&Number.isFinite(+r[7])).map(r=>[+r[0],+r[7]]);
      const rates=new Map();
      comparison.forEach(r=>{if(Number.isFinite(r.tempRate)&&Number.isFinite(r.tempAt))rates.set(r.tempAt,r.tempRate);});
      function dots(points,top,title,color,minimumRange){
        if(!points.length){ctx.fillStyle="#536577";ctx.fillText(title+"（未記録）",left,top);return;}
        let lo=points[0][1],hi=lo;
        points.forEach(p=>{lo=Math.min(lo,p[1]);hi=Math.max(hi,p[1]);});
        const mid=(lo+hi)/2, span=Math.max(minimumRange,hi-lo),y=v=>top+82-(v-mid+span/2)*82/span;
        axis(top,title,[mid-span/2,mid,mid+span/2].map(v=>+v.toFixed(2)),y);
        ctx.fillStyle=color;points.forEach(p=>ctx.fillRect(x(p[0])-1,y(p[1])-1,3,3));
      }
      dots(temperatures,875,"時計内部の温度 [℃]","#bf4e28",0.4);
      dots([...rates],1005,"温度変化率 [℃/分]","#246d87",0.2);
      ctx.fillStyle="#182230";for(let i=0;i<=4;i++)ctx.fillText(date(first+(end-first)*i/4),left+w*i/4-23,1120);
    }
    const head=table.createTHead().insertRow();
    ["開始","判定","理由","観測秒",profile.restPowerVersion?"Pose RMS [g]":"3D drift [g]","Peak sum [g]","ピーク数","信頼度 [%]"].concat(thermal?["温度 [℃]","変化率 [℃/分]","装着判定理由"]:[]).forEach(t=>{
      const cell=document.createElement("th");cell.textContent=t;head.append(cell);
    });
    const body=table.createTBody();
    decisions.forEach(r=>{
      const tr=body.insertRow();
      [date(+r[0]),label(+r[2]),r[3],r[4],r[5],r[7],r[8],+r[10]<0?"—":r[10]].concat(thermal?[r[15]?(+r[15]).toFixed(2):"—",r[16]?(+r[16]).toFixed(2):"—",r[17]||"—"]:[])
        .forEach(v=>tr.insertCell().textContent=v);
    });
    canvas.hidden=false;
    status.textContent="候補閾値：揺れ "+trial.config.noiseG+"g / 姿勢変動 "+trial.config.driftG+"g\n"+accel.length+" 加速度点 / "+hrm.length+" 心拍点 / "+decisions.length+" 判定枠";
  } catch(e) { status.textContent=e.message; }
}
raw.addEventListener("change",redraw);out.addEventListener("change",redraw);
document.getElementById("noise").addEventListener("change",redraw);
document.getElementById("drift").addEventListener("change",redraw);
document.getElementById("thermal").addEventListener("change",redraw);
</script>
</html>
