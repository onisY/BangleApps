<html>
<head>
  <link rel="stylesheet" href="../../css/spectre.min.css">
</head>
<body>
  <div id="data"></div>
  <script src="../../core/lib/interface.js"></script>
  <script>
var dataElement = document.getElementById("data");

function getData() {
  Util.showModal("Loading...");
  dataElement.innerHTML = "";
  Puck.eval('require("Storage").list(/^sens.*\\.csv$/)', function(files) {
    if (!files.length) {
      dataElement.innerHTML = "<p>No saved sens data</p>";
      Util.hideModal();
      return;
    }
    files.forEach(function(fn) {
      var card = document.createElement("div");
      card.className = "card";
      card.innerHTML =
        '<div class="card-header"><div class="card-title h5"></div></div>' +
        '<div class="card-footer">' +
        '<button class="btn btn-primary" act="save">Save CSV</button> ' +
        '<button class="btn" act="delete">Delete</button>' +
        '</div>';
      card.querySelector(".card-title").textContent = fn;
      card.querySelector('[act="save"]').addEventListener("click", function() {
        Util.readStorageFile(fn, function(data) {
          Util.saveCSV(fn.slice(0, -4), data);
        });
      });
      card.querySelector('[act="delete"]').addEventListener("click", function() {
        Util.showModal("Deleting...");
        Util.eraseStorageFile(fn, function() {
          Util.hideModal();
          getData();
        });
      });
      dataElement.appendChild(card);
    });
    Util.hideModal();
  });
}

function onInit() {
  getData();
}
  </script>
</body>
</html>
