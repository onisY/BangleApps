name: Orbit minute header update

on:
  push:
    paths:
      - '.github/workflows/orbit-minute-header.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch Orbit minute header
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('apps/orbit')
          ap=p/'app.js'
          s=ap.read_text()

          old='''  var tickTimer,eventTimer;\n  var interactive = false, idleTimer, lcdHeaderTimer;'''
          new='''  var tickTimer,eventTimer,headerClockTimer;\n  var headerClockMinute=-1;\n  var interactive = false, idleTimer, lcdHeaderTimer;'''
          assert old in s
          s=s.replace(old,new,1)

          old='''  function queueTick(){\n    if(tickTimer)clearTimeout(tickTimer);\n    var step=5*60000;\n    var wait=step-(Date.now()%step)+20;\n    tickTimer=setTimeout(function(){\n      tickTimer=undefined;\n      if(!interactive){\n        refreshBattery();\n        draw();\n      }\n      queueTick();\n    },wait);\n  }\n  function onLCD(on){'''
          new='''  function queueHeaderClock(){\n    if(headerClockTimer)clearTimeout(headerClockTimer);\n    // Check once per second, but repaint only when the displayed minute changes.\n    // This timer is intentionally independent of the 5-minute scene redraw.\n    var wait=1000-(Date.now()%1000)+20;\n    headerClockTimer=setTimeout(function(){\n      headerClockTimer=undefined;\n      var d=new Date();\n      var minuteKey=Math.floor(d.valueOf()/60000);\n      if(minuteKey!==headerClockMinute){\n        headerClockMinute=minuteKey;\n        refreshBattery();\n        drawHeader(d,false);\n      }\n      queueHeaderClock();\n    },wait);\n  }\n  function queueTick(){\n    if(tickTimer)clearTimeout(tickTimer);\n    var step=5*60000;\n    var wait=step-(Date.now()%step)+20;\n    tickTimer=setTimeout(function(){\n      tickTimer=undefined;\n      if(!interactive){\n        refreshBattery();\n        draw();\n      }\n      queueTick();\n    },wait);\n  }\n  function onLCD(on){'''
          assert old in s
          s=s.replace(old,new,1)

          old='''      lcdHeaderTimer=setTimeout(function(){\n        lcdHeaderTimer=undefined;\n        if(!interactive) drawHeaderOnly();\n      },80);\n      queueTick();\n    } else {\n      if(lcdHeaderTimer){clearTimeout(lcdHeaderTimer);lcdHeaderTimer=undefined;}\n      if(idleTimer){clearTimeout(idleTimer);idleTimer=undefined;}\n      interactive=false;\n      if(tickTimer){clearTimeout(tickTimer);tickTimer=undefined;}\n    }'''
          new='''      lcdHeaderTimer=setTimeout(function(){\n        lcdHeaderTimer=undefined;\n        if(!interactive) drawHeaderOnly();\n      },80);\n      headerClockMinute=Math.floor(Date.now()/60000);\n      queueHeaderClock();\n      queueTick();\n    } else {\n      if(lcdHeaderTimer){clearTimeout(lcdHeaderTimer);lcdHeaderTimer=undefined;}\n      if(headerClockTimer){clearTimeout(headerClockTimer);headerClockTimer=undefined;}\n      if(idleTimer){clearTimeout(idleTimer);idleTimer=undefined;}\n      interactive=false;\n      if(tickTimer){clearTimeout(tickTimer);tickTimer=undefined;}\n    }'''
          assert old in s
          s=s.replace(old,new,1)

          old='''  function cleanup(){\n    if(lcdHeaderTimer)clearTimeout(lcdHeaderTimer);\n    if(idleTimer)clearTimeout(idleTimer);'''
          new='''  function cleanup(){\n    if(lcdHeaderTimer)clearTimeout(lcdHeaderTimer);\n    if(headerClockTimer)clearTimeout(headerClockTimer);\n    if(idleTimer)clearTimeout(idleTimer);'''
          assert old in s
          s=s.replace(old,new,1)

          old='''  draw();\n  queueTick();\n  queueEventBuzz();'''
          new='''  draw();\n  headerClockMinute=Math.floor(Date.now()/60000);\n  queueHeaderClock();\n  queueTick();\n  queueEventBuzz();'''
          assert old in s
          s=s.replace(old,new,1)
          ap.write_text(s)

          # Minimal safe minifier used by this fork for generated runtime.
          def strip_comments(src):
            out=[];i=0;state='code';q=''
            while i<len(src):
              ch=src[i];n=src[i+1] if i+1<len(src) else ''
              if state=='code':
                if ch in "'\"`":state='str';q=ch;out.append(ch);i+=1;continue
                if ch=='/' and n=='/':state='line';i+=2;continue
                if ch=='/' and n=='*':state='block';i+=2;continue
                out.append(ch);i+=1;continue
              if state=='str':
                out.append(ch)
                if ch=='\\' and i+1<len(src):out.append(src[i+1]);i+=2;continue
                if ch==q:state='code'
                i+=1;continue
              if state=='line':
                if ch=='\n':out.append('\n');state='code'
                i+=1;continue
              if state=='block':
                if ch=='*' and n=='/':state='code';i+=2;continue
                i+=1
            return ''.join(out)
          def mini(src):
            src=strip_comments(src);out=[];i=0;state='code';q='';pending=False
            def word(c):return bool(c) and (c.isalnum() or c in '_$')
            while i<len(src):
              ch=src[i]
              if state=='code':
                if ch in "'\"`":
                  if pending:
                    prev=out[-1] if out else ''
                    if word(prev):out.append(' ')
                    pending=False
                  state='str';q=ch;out.append(ch);i+=1;continue
                if ch.isspace():pending=True;i+=1;continue
                if pending:
                  prev=out[-1] if out else ''
                  if (word(prev) and word(ch)) or (prev=='+' and ch=='+') or (prev=='-' and ch=='-'):out.append(' ')
                  pending=False
                out.append(ch);i+=1;continue
              out.append(ch)
              if ch=='\\' and i+1<len(src):out.append(src[i+1]);i+=2;continue
              if ch==q:state='code'
              i+=1
            return ''.join(out).strip()+'\n'
          (p/'app.min.js').write_text(mini(s))

          mp=p/'metadata.json'
          meta=json.loads(mp.read_text())
          assert meta['version']=='0.49'
          meta['version']='0.50'
          mp.write_text(json.dumps(meta,indent=2,ensure_ascii=False)+'\n')

          rp=p/'README.md'
          rp.write_text(rp.read_text()+'''\n\n## Version 0.50 independent minute header clock\n\n- The top clock now checks the current time once per second while the LCD is on.\n- Only when the minute changes is the header redrawn; the Sun/Earth/Moon scene is not redrawn by this clock update.\n- The existing lower-scene refresh remains on its separate 5-minute schedule.\n- The 1-second header monitor stops while the LCD is off and restarts when the LCD turns on.\n''')
          PY
      - name: Validate Orbit v0.50
        run: |
          node --check apps/orbit/app.js
          node --check apps/orbit/app.min.js
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('apps/orbit')
          a=(p/'app.js').read_text();m=(p/'app.min.js').read_text()
          assert 'function queueHeaderClock()' in a
          assert 'minuteKey!==headerClockMinute' in a
          assert 'drawHeader(d,false)' in a
          assert 'if(headerClockTimer){clearTimeout(headerClockTimer);headerClockTimer=undefined;}' in a
          assert 'var step=5*60000' in a
          assert 'function queueHeaderClock()' in m
          assert json.loads((p/'metadata.json').read_text())['version']=='0.50'
          print('Orbit v0.50 validation passed')
          PY
      - name: Commit Orbit v0.50
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+onisY@users.noreply.github.com'
          git add apps/orbit/app.js apps/orbit/app.min.js apps/orbit/metadata.json apps/orbit/README.md
          git commit -m 'Update Orbit header clock every minute'
          git push origin HEAD:master
