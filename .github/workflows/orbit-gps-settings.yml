name: Orbit GPS settings update

on:
  push:
    paths:
      - '.github/workflows/orbit-gps-settings.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regenerate minified settings and bump version
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('apps/orbit')
          src=(p/'settings.js').read_text()

          def strip_comments(src):
            out=[];i=0;state='code';q=''
            while i<len(src):
              ch=src[i];n=src[i+1] if i+1<len(src) else ''
              if state=='code':
                if ch in "'\"`": state='str';q=ch;out.append(ch);i+=1;continue
                if ch=='/' and n=='/': state='line';i+=2;continue
                if ch=='/' and n=='*': state='block';i+=2;continue
                out.append(ch);i+=1;continue
              if state=='str':
                out.append(ch)
                if ch=='\\' and i+1<len(src):out.append(src[i+1]);i+=2;continue
                if ch==q:state='code'
                i+=1;continue
              if state=='line':
                if ch=='\n':out.append('\n');state='code'
                i+=1;continue
              if state=='block':
                if ch=='*' and n=='/':state='code';i+=2;continue
                i+=1
            return ''.join(out)

          def mini(src):
            src=strip_comments(src);out=[];i=0;state='code';q='';pending=False
            def word(c):return bool(c) and (c.isalnum() or c in '_$')
            while i<len(src):
              ch=src[i]
              if state=='code':
                if ch in "'\"`":
                  if pending:
                    prev=out[-1] if out else ''
                    if word(prev):out.append(' ')
                    pending=False
                  state='str';q=ch;out.append(ch);i+=1;continue
                if ch.isspace():pending=True;i+=1;continue
                if pending:
                  prev=out[-1] if out else ''
                  if (word(prev) and word(ch)) or (prev=='+' and ch=='+') or (prev=='-' and ch=='-'):out.append(' ')
                  pending=False
                out.append(ch);i+=1;continue
              out.append(ch)
              if ch=='\\' and i+1<len(src):out.append(src[i+1]);i+=2;continue
              if ch==q:state='code'
              i+=1
            return ''.join(out).strip()+'\n'

          (p/'settings.min.js').write_text(mini(src))

          meta_path=p/'metadata.json'
          meta=json.loads(meta_path.read_text())
          meta['version']='0.44'
          meta['description']='Lightweight Sun-Earth-Moon clock for Bangle.js 2 with world-capital, manual and on-demand GPS locations, Japan regional locations, North/South views, daily solar-event buzzes, swipe screenshots, optional calendar launch and BLE reset.'
          meta_path.write_text(json.dumps(meta,indent=2,ensure_ascii=False)+'\n')

          readme=p/'README.md'
          readme.write_text(readme.read_text()+'''\n\n## Version 0.44 on-demand GPS location input\n\n- Location mode now has three choices: **Place / Manual / GPS**.\n- Selecting GPS starts the receiver only while the Orbit settings screen is acquiring a fix.\n- GPS power is requested with the dedicated tag `orbitsettings`.\n- After a valid fix is saved, Orbit removes only its own GPS power request with `Bangle.setGPSPower(0,"orbitsettings")`. If another app still requests GPS under another tag, the receiver remains on.\n- Canceling GPS acquisition, leaving Orbit settings, or killing the settings app also removes Orbit's GPS listener and GPS power request.\n- A saved GPS location is retained after acquisition; reopening GPS mode does not continuously run GPS. Use **Get GPS fix** to refresh it.\n- Latitude, longitude and GPS altitude (when available) are stored in `orbit.json`.\n''')
          PY
      - name: Validate Orbit GPS settings
        run: |
          node --check apps/orbit/settings.js
          node --check apps/orbit/settings.min.js
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('apps/orbit')
          a=(p/'settings.js').read_text();m=(p/'settings.min.js').read_text()
          for s in (a,m):
            assert 'LOCATION_MODES=["Place","Manual","GPS"]' in s
            assert 'Bangle.setGPSPower(1,GPS_ID)' in s
            assert 'Bangle.setGPSPower(0,GPS_ID)' in s
            assert 'Bangle.removeListener("GPS",gpsHandler)' in s
            assert 'E.on("kill",onKill)' in s
            assert 'GPS_ID="orbitsettings"' in s
          assert json.loads((p/'metadata.json').read_text())['version']=='0.44'
          print('Orbit v0.44 GPS settings checks passed')
          PY
      - name: Commit Orbit v0.44
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/orbit/settings.min.js apps/orbit/metadata.json apps/orbit/README.md
          git commit -m 'Add on-demand GPS location mode to Orbit'
          git push origin HEAD:master
