name: Orbit coordinate label update

on:
  push:
    paths:
      - '.github/workflows/orbit-coordinates-label.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch manual/GPS location labels
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('apps/orbit')
          for name in ['app.js','app.min.js']:
            path=p/name
            s=path.read_text()
            old='if(settings.locationMode===2){'
            assert old in s, (name,'target not found')
            s=s.replace(old,'if(settings.locationMode!==0){',1)
            path.write_text(s)

          meta_path=p/'metadata.json'
          meta=json.loads(meta_path.read_text())
          meta['version']='0.46'
          meta_path.write_text(json.dumps(meta,indent=2,ensure_ascii=False)+'\n')

          readme=p/'README.md'
          readme.write_text(readme.read_text()+'''\n\n## Version 0.46 coordinate labels for Manual/GPS locations\n\n- The lower-right location label now shows latitude, longitude and elevation on three lines whenever the location mode is **Manual** or **GPS**.\n- **Place** mode continues to show the stored region/country and place name.\n- Format: `Lat xx.xxxx`, `Lon xxx.xxxx`, `Alt xxxm`.\n''')
          PY
      - name: Validate
        run: |
          node --check apps/orbit/app.js
          node --check apps/orbit/app.min.js
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('apps/orbit')
          for name in ['app.js','app.min.js']:
            s=(p/name).read_text()
            assert 'if(settings.locationMode!==0){' in s
            assert 'if(settings.locationMode===2){' not in s
            assert 'Lat '+'' in s
            assert 'Lon '+'' in s
            assert 'Alt '+'' in s
          assert json.loads((p/'metadata.json').read_text())['version']=='0.46'
          print('Orbit v0.46 coordinate-label checks passed')
          PY
      - name: Commit Orbit v0.46
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+onisY@users.noreply.github.com'
          git add apps/orbit/app.js apps/orbit/app.min.js apps/orbit/metadata.json apps/orbit/README.md
          git commit -m 'Show coordinates for manual and GPS locations in Orbit'
          git push origin HEAD:master
