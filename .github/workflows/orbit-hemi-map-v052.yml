name: Orbit hemisphere map v0.52

on:
  push:
    paths:
      - '.github/workflows/orbit-hemi-map-v052.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch and validate Orbit v0.52
        run: |
          python -c "import base64;exec(base64.b64decode(''))"
          node --check apps/orbit/app.js
          node --check apps/orbit/app.min.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+onisY@users.noreply.github.com'
          git add apps/orbit/app.js apps/orbit/app.min.js apps/orbit/metadata.json apps/orbit/README.md
          git commit -m 'Refine Orbit hemisphere maps for watch display'
          git push origin HEAD:master
