name: Orbit remove altitude

on:
  push:
    paths:
      - '.github/workflows/orbit-remove-altitude.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Remove altitude from Orbit
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          p=Path('apps/orbit')

          # ---------- app.js ----------
          app=p/'app.js'
          s=app.read_text()
          s=s.replace('locPref:"Tokyo",locName:"Chiyoda-ku",lat:35.694,lon:139.754,elevationM:16,','locPref:"Tokyo",locName:"Chiyoda-ku",lat:35.694,lon:139.754,')
          s=s.replace('    settings.elevationM=16;\n','')
          s=re.sub(r'  if\(settings\.locationMode!==1 && settings\.locPref==="Tokyo" &&\n     settings\.locName==="Chiyoda-ku" && \(!isFinite\(settings\.elevationM\) \|\| settings\.elevationM===0\)\)\{\n    settings\.elevationM=16;\n    Storage\.writeJSON\(FILE,settings\);\n  \}\n','',s)
          s=s.replace('  var loc = {name:settings.locName,lat:settings.lat,lon:settings.lon,\n    elevationM:settings.elevationM||0,pref:settings.locPref};','  var loc = {name:settings.locName,lat:settings.lat,lon:settings.lon,pref:settings.locPref};')

          # Remove any legacy altitude fields from saved Orbit settings at startup.
          needle='''  Object.keys(def).forEach(function(k){ if (settings[k]===undefined) settings[k]=def[k]; });\n'''
          repl='''  Object.keys(def).forEach(function(k){ if (settings[k]===undefined) settings[k]=def[k]; });\n  if(settings.elevationM!==undefined || settings.manualElevationM!==undefined){\n    delete settings.elevationM; delete settings.manualElevationM;\n    Storage.writeJSON(FILE,settings);\n  }\n'''
          assert needle in s
          s=s.replace(needle,repl,1)

          # Manual/GPS readout becomes three lines: mode, latitude, longitude.
          old='''    var lines=[\n      settings.locationMode===2?"GPS":"manual",\n      coordText(loc.lat,"N","S"),\n      coordText(loc.lon,"E","W"),\n      Math.round(loc.elevationM)+"m"\n    ];'''
          new='''    var lines=[\n      settings.locationMode===2?"GPS":"manual",\n      coordText(loc.lat,"N","S"),\n      coordText(loc.lon,"E","W")\n    ];'''
          assert old in s
          s=s.replace(old,new,1)
          s=s.replace('var x1=W-1,x0=x1-53,blockH=35;','var x1=W-1,x0=x1-53,blockH=26;')
          app.write_text(s)

          # ---------- settings.js ----------
          st=p/'settings.js'
          s=st.read_text()
          s=s.replace('locPref:"Tokyo",locName:"Chiyoda-ku",lat:35.694,lon:139.754,elevationM:16,\n    manualLat:35.694,manualLon:139.754,manualElevationM:16,','locPref:"Tokyo",locName:"Chiyoda-ku",lat:35.694,lon:139.754,\n    manualLat:35.694,manualLon:139.754,')
          s=s.replace('  var gpsFixAt=0,gpsFixLat,gpsFixLon,gpsAltSamples=[],gpsAltTimer;\n  var GPS_ALT_SAMPLE_MS=20000;\n','')

          needle='''  Object.keys(d).forEach(function(k){if(s[k]===undefined)s[k]=d[k];});\n'''
          repl='''  Object.keys(d).forEach(function(k){if(s[k]===undefined)s[k]=d[k];});\n  if(s.elevationM!==undefined||s.manualElevationM!==undefined){\n    delete s.elevationM;delete s.manualElevationM;Storage.writeJSON(FILE,s);\n  }\n'''
          assert needle in s
          s=s.replace(needle,repl,1)

          s=s.replace('s.locName=p[0];s.lat=p[1];s.lon=p[2];s.elevationM=(p.length>3&&isFinite(p[3]))?p[3]:0;write();','s.locName=p[0];s.lat=p[1];s.lon=p[2];write();')
          s=s.replace('    s.lat=s.manualLat;s.lon=s.manualLon;s.elevationM=s.manualElevationM;write();','    s.lat=s.manualLat;s.lon=s.manualLon;write();')
          s=s.replace('    s.lat=fix.lat;s.lon=fix.lon;\n    s.elevationM=isFinite(fix.alt)?Math.round(fix.alt):0;\n','    s.lat=fix.lat;s.lon=fix.lon;\n')
          s=re.sub(r'  function median\(a\)\{.*?\n  \}\n','',s,flags=re.S)
          s=s.replace('    if(gpsAltTimer){clearTimeout(gpsAltTimer);gpsAltTimer=undefined;}\n','')
          s=s.replace('    if(gpsFixAt)return "ALTITUDE";\n','')

          # Replace progress menu with altitude-free version.
          s=re.sub(r'''    var menu=\{\n      "":\{title:"GPS input"\},\n      "< Cancel":cancelGPS,\n      "State":\{value:0,min:0,max:0,format:function\(\)\{return gpsStateText\(fix\);\}\},\n      "Satellites":\{value:0,min:0,max:0,format:function\(\)\{return sats\+" "\+gpsBar\(sats\);\}\},\n      "HDOP":\{value:0,min:0,max:0,format:function\(\)\{return hd;\}\},\n      "Elapsed":\{value:0,min:0,max:0,format:function\(\)\{return gpsElapsed\(\);\}\}\n    \};\n    if\(gpsFixAt\)\{.*?\n    \}\n    E\.showMenu\(menu\);''','''    E.showMenu({\n      "":{title:"GPS input"},\n      "< Cancel":cancelGPS,\n      "State":{value:0,min:0,max:0,format:function(){return gpsStateText(fix);}},\n      "Satellites":{value:0,min:0,max:0,format:function(){return sats+" "+gpsBar(sats);}},\n      "HDOP":{value:0,min:0,max:0,format:function(){return hd;}},\n      "Elapsed":{value:0,min:0,max:0,format:function(){return gpsElapsed();}}\n    });''',s,flags=re.S)

          s=s.replace('''  function gpsLocationText(){\n    return "Lat "+Number(s.lat).toFixed(4)+"\\nLon "+Number(s.lon).toFixed(4)+\n      "\\nAlt "+Math.round(s.elevationM||0)+" m";\n  }''','''  function gpsLocationText(){\n    return "Lat "+Number(s.lat).toFixed(4)+"\\nLon "+Number(s.lon).toFixed(4);\n  }''')

          # Remove finishGPSAltitude helper completely.
          s=re.sub(r'  function finishGPSAltitude\(\)\{.*?\n  \}\n  function startGPS','  function startGPS',s,flags=re.S)

          # Replace the altitude-settling GPS handler with immediate lat/lon save.
          old='''    gpsStarted=Date.now();gpsLastDraw=0;gpsLastSats=-1;gpsLastHdop=-1;gpsLastFix={};\n    gpsFixAt=0;gpsFixLat=undefined;gpsFixLon=undefined;gpsAltSamples=[];\n    gpsHandler=function(fix){\n      if(!gpsActive||!fix)return;\n      gpsLastFix=fix;\n      if(fix.fix&&isFinite(fix.lat)&&isFinite(fix.lon)){\n        if(!gpsFixAt){\n          // Lock horizontal position at the first valid fix, but keep the GPS\n          // running briefly so the noisier altitude can settle.\n          gpsFixAt=Date.now();gpsFixLat=fix.lat;gpsFixLon=fix.lon;\n          try{Bangle.buzz(80);}catch(e){}\n          gpsAltTimer=setTimeout(finishGPSAltitude,GPS_ALT_SAMPLE_MS);\n        }\n        if(isFinite(fix.alt))gpsAltSamples.push(fix.alt);\n        showGPSProgress(false);\n        return;\n      }\n      showGPSProgress(false);\n    };'''
          new='''    gpsStarted=Date.now();gpsLastDraw=0;gpsLastSats=-1;gpsLastHdop=-1;gpsLastFix={};\n    gpsHandler=function(fix){\n      if(!gpsActive||!fix)return;\n      gpsLastFix=fix;\n      if(fix.fix&&isFinite(fix.lat)&&isFinite(fix.lon)){\n        applyGPS(fix);stopGPS();\n        try{Bangle.buzz(300);}catch(e){}\n        E.showAlert("GPS location saved\\n"+gpsLocationText(),"Orbit GPS").then(show);\n        return;\n      }\n      showGPSProgress(false);\n    };'''
          assert old in s
          s=s.replace(old,new,1)

          s=s.replace('s.manualLat=s.lat;s.manualLon=s.lon;s.manualElevationM=s.elevationM||0;','s.manualLat=s.lat;s.manualLon=s.lon;')
          s=s.replace('+"\\nAlt "+Math.round(s.elevationM)+" m"','')
          s=re.sub(r'\n      m\["Elevation m"\]=\{[^\n]+\};','',s)
          st.write_text(s)

          # ---------- locations.js ----------
          # Strip the fourth numeric element (altitude) from every place tuple.
          lp=p/'locations.js'
          l=lp.read_text()
          num=r'-?\d+(?:\.\d+)?'
          pat=re.compile(r'(\["(?:\\.|[^"\\])*",'+num+r','+num+r'),'+num+r'\]')
          l2,n=pat.subn(r'\1]',l)
          if n < 100:
            raise RuntimeError('Too few altitude fields removed from locations.js: %d'%n)
          lp.write_text(l2)

          # ---------- minify ----------
          def strip_comments(src):
            out=[];i=0;state='code';q=''
            while i<len(src):
              ch=src[i];nxt=src[i+1] if i+1<len(src) else ''
              if state=='code':
                if ch in "'\"`":state='str';q=ch;out.append(ch);i+=1;continue
                if ch=='/' and nxt=='/':state='line';i+=2;continue
                if ch=='/' and nxt=='*':state='block';i+=2;continue
                out.append(ch);i+=1;continue
              if state=='str':
                out.append(ch)
                if ch=='\\' and i+1<len(src):out.append(src[i+1]);i+=2;continue
                if ch==q:state='code'
                i+=1;continue
              if state=='line':
                if ch=='\n':out.append('\n');state='code'
                i+=1;continue
              if state=='block':
                if ch=='*' and nxt=='/':state='code';i+=2;continue
                i+=1
            return ''.join(out)
          def mini(src):
            src=strip_comments(src);out=[];i=0;state='code';q='';pending=False
            def word(c):return bool(c) and (c.isalnum() or c in '_$')
            while i<len(src):
              ch=src[i]
              if state=='code':
                if ch in "'\"`":
                  if pending:
                    prev=out[-1] if out else ''
                    if word(prev):out.append(' ')
                    pending=False
                  state='str';q=ch;out.append(ch);i+=1;continue
                if ch.isspace():pending=True;i+=1;continue
                if pending:
                  prev=out[-1] if out else ''
                  if (word(prev) and word(ch)) or (prev=='+' and ch=='+') or (prev=='-' and ch=='-'):out.append(' ')
                  pending=False
                out.append(ch);i+=1;continue
              out.append(ch)
              if ch=='\\' and i+1<len(src):out.append(src[i+1]);i+=2;continue
              if ch==q:state='code'
              i+=1
            return ''.join(out).strip()+'\n'
          (p/'app.min.js').write_text(mini(app.read_text()))
          (p/'settings.min.js').write_text(mini(st.read_text()))

          meta_path=p/'metadata.json'
          meta=json.loads(meta_path.read_text())
          meta['version']='0.48'
          meta_path.write_text(json.dumps(meta,indent=2,ensure_ascii=False)+'\n')

          readme=p/'README.md'
          readme.write_text(readme.read_text()+'''\n\n## Version 0.48 altitude removed\n\n- Orbit now treats every location as latitude + longitude only.\n- Altitude/elevation has been removed from Place, Manual and GPS location data, settings and on-screen readouts.\n- Legacy altitude fields in `orbit.json` are removed automatically when the updated app/settings are opened.\n- GPS acquisition now finishes as soon as a valid latitude/longitude fix is obtained; the former 20-second altitude sampling stage is removed.\n- Sunrise/sunset calculations remain based on latitude, longitude, solar declination and the standard -0.833 degree solar altitude, without observer-elevation correction.\n''')
          PY
      - name: Validate
        run: |
          node --check apps/orbit/app.js
          node --check apps/orbit/app.min.js
          node --check apps/orbit/settings.js
          node --check apps/orbit/settings.min.js
          node --check apps/orbit/locations.js
          python - <<'PY'
          import json,re
          from pathlib import Path
          p=Path('apps/orbit')
          for name in ['app.js','app.min.js','settings.js','settings.min.js']:
            x=(p/name).read_text()
            for bad in ['elevationM','manualElevationM','gpsAltSamples','GPS_ALT_SAMPLE_MS','fix.alt','Elevation m']:
              assert bad not in x,(name,bad)
          loc=(p/'locations.js').read_text()
          num=r'-?\d+(?:\.\d+)?'
          assert not re.search(r'\["(?:\\.|[^"\\])*",'+num+r','+num+r','+num+r'\]',loc)
          assert json.loads((p/'metadata.json').read_text())['version']=='0.48'
          print('Orbit v0.48 altitude removal checks passed')
          PY
      - name: Commit Orbit v0.48
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+onisY@users.noreply.github.com'
          git add apps/orbit/app.js apps/orbit/app.min.js apps/orbit/settings.js apps/orbit/settings.min.js apps/orbit/locations.js apps/orbit/metadata.json apps/orbit/README.md
          git commit -m 'Remove altitude from Orbit locations'
          git push origin HEAD:master
