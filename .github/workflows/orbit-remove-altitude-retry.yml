name: Orbit remove altitude retry

on:
  push:
    paths:
      - '.github/workflows/orbit-remove-altitude-retry.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reuse altitude-removal patch
        run: |
          python - <<'PY'
          from pathlib import Path
          w=Path('.github/workflows/orbit-remove-altitude.yml').read_text().splitlines()
          start=next(i for i,x in enumerate(w) if "python - <<'PY'" in x)+1
          end=next(i for i in range(start,len(w)) if w[i].strip()=='PY')
          code='\n'.join((x[10:] if x.startswith('          ') else x) for x in w[start:end])+'\n'
          Path('/tmp/orbit_patch.py').write_text(code)
          PY
          python /tmp/orbit_patch.py
      - name: Validate
        run: |
          node --check apps/orbit/app.js
          node --check apps/orbit/app.min.js
          node --check apps/orbit/settings.js
          node --check apps/orbit/settings.min.js
          node --check apps/orbit/locations.js
          python - <<'PY'
          import json,re
          from pathlib import Path
          p=Path('apps/orbit')
          for name in ['app.js','app.min.js','settings.js','settings.min.js']:
            x=(p/name).read_text()
            for bad in ['gpsAltSamples','GPS_ALT_SAMPLE_MS','fix.alt','Elevation m','Alt samples','Alt wait']:
              assert bad not in x,(name,bad)
            # elevationM/manualElevationM may appear only in the one-time legacy-key deletion.
            y=re.sub(r'if\([^\n]*(?:elevationM|manualElevationM)[^\n]*\)\{[^}]*\}','',x)
            assert 'elevationM' not in y and 'manualElevationM' not in y,(name,'legacy altitude reference outside cleanup')
          loc=(p/'locations.js').read_text()
          num=r'-?\d+(?:\.\d+)?'
          assert not re.search(r'\["(?:\\.|[^"\\])*",'+num+r','+num+r','+num+r'\]',loc)
          app=(p/'app.js').read_text()
          assert 'Math.sin(-0.833*RAD)' in app
          assert json.loads((p/'metadata.json').read_text())['version']=='0.48'
          print('Orbit v0.48 altitude removal checks passed')
          PY
      - name: Commit Orbit v0.48
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+onisY@users.noreply.github.com'
          git add apps/orbit/app.js apps/orbit/app.min.js apps/orbit/settings.js apps/orbit/settings.min.js apps/orbit/locations.js apps/orbit/metadata.json apps/orbit/README.md
          git commit -m 'Remove altitude from Orbit locations'
          git push origin HEAD:master
