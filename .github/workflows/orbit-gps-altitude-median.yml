name: Orbit GPS altitude median update

on:
  push:
    paths:
      - '.github/workflows/orbit-gps-altitude-median.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch GPS altitude sampling
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('apps/orbit')
          path=p/'settings.js'
          s=path.read_text()

          old='''  var gpsHandler,gpsActive=false,gpsReturnMode=0;\n  var gpsStarted=0,gpsLastDraw=0,gpsLastSats=-1,gpsLastHdop=-1,gpsLastFix;'''
          new='''  var gpsHandler,gpsActive=false,gpsReturnMode=0;\n  var gpsStarted=0,gpsLastDraw=0,gpsLastSats=-1,gpsLastHdop=-1,gpsLastFix;\n  var gpsFixAt=0,gpsFixLat,gpsFixLon,gpsAltSamples=[],gpsAltTimer;\n  var GPS_ALT_SAMPLE_MS=20000;'''
          assert old in s
          s=s.replace(old,new,1)

          old='''  function applyGPS(fix){\n    s.locationMode=2;\n    s.locPref="GPS";s.locName="GPS";\n    s.lat=fix.lat;s.lon=fix.lon;\n    s.elevationM=isFinite(fix.alt)?Math.round(fix.alt):0;\n    write();\n  }'''
          new='''  function applyGPS(fix){\n    s.locationMode=2;\n    s.locPref="GPS";s.locName="GPS";\n    s.lat=fix.lat;s.lon=fix.lon;\n    s.elevationM=isFinite(fix.alt)?Math.round(fix.alt):0;\n    write();\n  }\n  function median(a){\n    if(!a.length)return NaN;\n    var b=a.slice().sort(function(x,y){return x-y;}),n=b.length,m=n>>1;\n    return n&1?b[m]:(b[m-1]+b[m])/2;\n  }'''
          assert old in s
          s=s.replace(old,new,1)

          old='''  function stopGPS(){\n    if(gpsHandler){\n      try{Bangle.removeListener("GPS",gpsHandler);}catch(e){}\n      gpsHandler=undefined;\n    }\n    gpsActive=false;gpsLastFix=undefined;\n    try{Bangle.setGPSPower(0,GPS_ID);}catch(e){}\n  }'''
          new='''  function stopGPS(){\n    if(gpsHandler){\n      try{Bangle.removeListener("GPS",gpsHandler);}catch(e){}\n      gpsHandler=undefined;\n    }\n    if(gpsAltTimer){clearTimeout(gpsAltTimer);gpsAltTimer=undefined;}\n    gpsActive=false;gpsLastFix=undefined;\n    try{Bangle.setGPSPower(0,GPS_ID);}catch(e){}\n  }'''
          assert old in s
          s=s.replace(old,new,1)

          old='''  function gpsStateText(fix){\n    var sats=fix&&isFinite(fix.satellites)?fix.satellites|0:0;\n    if(fix&&fix.fix)return "FIX";\n    if(sats===0)return "NO SATS";\n    if(sats<3)return "SEARCHING";\n    if(sats<4)return "ACQUIRING";\n    return "LOCKING";\n  }'''
          new='''  function gpsStateText(fix){\n    var sats=fix&&isFinite(fix.satellites)?fix.satellites|0:0;\n    if(gpsFixAt)return "ALTITUDE";\n    if(fix&&fix.fix)return "FIX";\n    if(sats===0)return "NO SATS";\n    if(sats<3)return "SEARCHING";\n    if(sats<4)return "ACQUIRING";\n    return "LOCKING";\n  }'''
          assert old in s
          s=s.replace(old,new,1)

          old='''    E.showMenu({\n      "":{title:"GPS input"},\n      "< Cancel":cancelGPS,\n      "State":{value:0,min:0,max:0,format:function(){return gpsStateText(fix);}},\n      "Satellites":{value:0,min:0,max:0,format:function(){return sats+" "+gpsBar(sats);}},\n      "HDOP":{value:0,min:0,max:0,format:function(){return hd;}},\n      "Elapsed":{value:0,min:0,max:0,format:function(){return gpsElapsed();}}\n    });'''
          new='''    var menu={\n      "":{title:"GPS input"},\n      "< Cancel":cancelGPS,\n      "State":{value:0,min:0,max:0,format:function(){return gpsStateText(fix);}},\n      "Satellites":{value:0,min:0,max:0,format:function(){return sats+" "+gpsBar(sats);}},\n      "HDOP":{value:0,min:0,max:0,format:function(){return hd;}},\n      "Elapsed":{value:0,min:0,max:0,format:function(){return gpsElapsed();}}\n    };\n    if(gpsFixAt){\n      menu["Alt samples"]={value:0,min:0,max:0,format:function(){return ""+gpsAltSamples.length;}};\n      menu["Alt wait"]={value:0,min:0,max:0,format:function(){\n        var left=Math.max(0,Math.ceil((GPS_ALT_SAMPLE_MS-(Date.now()-gpsFixAt))/1000));\n        return left+" s";\n      }};\n    }\n    E.showMenu(menu);'''
          assert old in s
          s=s.replace(old,new,1)

          old='''  function cancelGPS(){\n    stopGPS();\n    s.locationMode=gpsReturnMode;\n    applyCurrent();\n    write();\n    show();\n  }\n  function startGPS(returnMode){'''
          new='''  function cancelGPS(){\n    stopGPS();\n    s.locationMode=gpsReturnMode;\n    applyCurrent();\n    write();\n    show();\n  }\n  function finishGPSAltitude(){\n    if(!gpsActive||!gpsFixAt)return;\n    var alt=median(gpsAltSamples);\n    var finalFix={lat:gpsFixLat,lon:gpsFixLon,alt:isFinite(alt)?alt:0};\n    applyGPS(finalFix);\n    var count=gpsAltSamples.length;\n    stopGPS();\n    gpsFixAt=0;gpsAltSamples=[];\n    try{Bangle.buzz(300);}catch(e){}\n    E.showAlert("GPS location saved\\n"+gpsLocationText()+"\\nAlt samples "+count,"Orbit GPS").then(show);\n  }\n  function startGPS(returnMode){'''
          assert old in s
          s=s.replace(old,new,1)

          old='''    gpsStarted=Date.now();gpsLastDraw=0;gpsLastSats=-1;gpsLastHdop=-1;gpsLastFix={};\n    gpsHandler=function(fix){\n      if(!gpsActive||!fix)return;\n      gpsLastFix=fix;\n      if(fix.fix&&isFinite(fix.lat)&&isFinite(fix.lon)){\n        applyGPS(fix);stopGPS();\n        try{Bangle.buzz(300);}catch(e){}\n        E.showAlert("GPS location saved\\n"+gpsLocationText(),"Orbit GPS").then(show);\n        return;\n      }\n      showGPSProgress(false);\n    };'''
          new='''    gpsStarted=Date.now();gpsLastDraw=0;gpsLastSats=-1;gpsLastHdop=-1;gpsLastFix={};\n    gpsFixAt=0;gpsFixLat=undefined;gpsFixLon=undefined;gpsAltSamples=[];\n    gpsHandler=function(fix){\n      if(!gpsActive||!fix)return;\n      gpsLastFix=fix;\n      if(fix.fix&&isFinite(fix.lat)&&isFinite(fix.lon)){\n        if(!gpsFixAt){\n          // Lock horizontal position at the first valid fix, but keep the GPS\n          // running briefly so the noisier altitude can settle.\n          gpsFixAt=Date.now();gpsFixLat=fix.lat;gpsFixLon=fix.lon;\n          try{Bangle.buzz(80);}catch(e){}\n          gpsAltTimer=setTimeout(finishGPSAltitude,GPS_ALT_SAMPLE_MS);\n        }\n        if(isFinite(fix.alt))gpsAltSamples.push(fix.alt);\n        showGPSProgress(false);\n        return;\n      }\n      showGPSProgress(false);\n    };'''
          assert old in s
          s=s.replace(old,new,1)

          path.write_text(s)

          def strip_comments(src):
            out=[];i=0;state='code';q=''
            while i<len(src):
              ch=src[i];n=src[i+1] if i+1<len(src) else ''
              if state=='code':
                if ch in "'\"`":state='str';q=ch;out.append(ch);i+=1;continue
                if ch=='/' and n=='/':state='line';i+=2;continue
                if ch=='/' and n=='*':state='block';i+=2;continue
                out.append(ch);i+=1;continue
              if state=='str':
                out.append(ch)
                if ch=='\\' and i+1<len(src):out.append(src[i+1]);i+=2;continue
                if ch==q:state='code'
                i+=1;continue
              if state=='line':
                if ch=='\n':out.append('\n');state='code'
                i+=1;continue
              if state=='block':
                if ch=='*' and n=='/':state='code';i+=2;continue
                i+=1
            return ''.join(out)
          def mini(src):
            src=strip_comments(src);out=[];i=0;state='code';q='';pending=False
            def word(c):return bool(c) and (c.isalnum() or c in '_$')
            while i<len(src):
              ch=src[i]
              if state=='code':
                if ch in "'\"`":
                  if pending:
                    prev=out[-1] if out else ''
                    if word(prev):out.append(' ')
                    pending=False
                  state='str';q=ch;out.append(ch);i+=1;continue
                if ch.isspace():pending=True;i+=1;continue
                if pending:
                  prev=out[-1] if out else ''
                  if (word(prev) and word(ch)) or (prev=='+' and ch=='+') or (prev=='-' and ch=='-'):out.append(' ')
                  pending=False
                out.append(ch);i+=1;continue
              out.append(ch)
              if ch=='\\' and i+1<len(src):out.append(src[i+1]);i+=2;continue
              if ch==q:state='code'
              i+=1
            return ''.join(out).strip()+'\n'
          (p/'settings.min.js').write_text(mini(s))

          meta_path=p/'metadata.json'
          meta=json.loads(meta_path.read_text())
          meta['version']='0.47'
          meta_path.write_text(json.dumps(meta,indent=2,ensure_ascii=False)+'\n')

          readme=p/'README.md'
          readme.write_text(readme.read_text()+'''\n\n## Version 0.47 stabilized GPS altitude\n\n- The first valid GPS fix now locks latitude and longitude, but does not immediately save the altitude.\n- GPS remains on for 20 additional seconds and collects valid altitude samples.\n- The saved altitude is the **median** of those samples, making it much less sensitive to one bad early vertical fix.\n- During this short settling period the GPS screen shows `ALTITUDE`, the number of altitude samples, and the remaining wait time.\n- After the 20-second sampling window Orbit saves the location and removes only its own tagged GPS power request.\n''')
          PY
      - name: Validate
        run: |
          node --check apps/orbit/settings.js
          node --check apps/orbit/settings.min.js
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('apps/orbit')
          a=(p/'settings.js').read_text();m=(p/'settings.min.js').read_text()
          for x in (a,m):
            assert 'GPS_ALT_SAMPLE_MS=20000' in x
            assert 'function median' in x
            assert 'function finishGPSAltitude' in x
            assert 'gpsAltSamples.push(fix.alt)' in x
            assert 'setTimeout(finishGPSAltitude,GPS_ALT_SAMPLE_MS)' in x
          assert json.loads((p/'metadata.json').read_text())['version']=='0.47'
          print('Orbit v0.47 GPS altitude median checks passed')
          PY
      - name: Commit Orbit v0.47
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+onisY@users.noreply.github.com'
          git add apps/orbit/settings.js apps/orbit/settings.min.js apps/orbit/metadata.json apps/orbit/README.md
          git commit -m 'Stabilize Orbit GPS altitude with median sampling'
          git push origin HEAD:master
