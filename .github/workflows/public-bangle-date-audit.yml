name: Temporary public Bangle App Loader date audit
on:
  push:
    paths:
      - '.github/workflows/public-bangle-date-audit.yml'
permissions:
  contents: read
jobs:
  public-appdates:
    runs-on: ubuntu-latest
    steps:
      - name: Read official public CSV and compute complete date histogram
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request, csv, io, json, collections, datetime, sys, re
          today=datetime.datetime(2026,11,12,tzinfo=datetime.timezone(datetime.timedelta(hours=9)))
          urls=[
            "https://banglejs.com/apps/appdates.csv",
            "https://banglejs.com/apps/apps.json",
            "https://banglejs.com/apps/apps/orbit/metadata.json",
            "https://espruino.github.io/BangleApps/appdates.csv"
          ]
          data={}
          for url in urls:
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 (Research; public BangleApps date audit)','Accept':'*/*'})
              with urllib.request.urlopen(req,timeout=35) as r:
                contents=r.read(8000000)
                data[url]=(r.status,contents)
                print('AUDIT_FETCH '+json.dumps({'url':url,'status':r.status,'bytes':len(contents),'Last-Modified':r.headers.get('Last-Modified'),'Date':r.headers.get('Date'),'ETag':r.headers.get('ETag')}))
            except Exception as e:
              print('AUDIT_FETCH_FAIL '+json.dumps({'url':url,'reason':str(e)}))
          official="https://banglejs.com/apps/appdates.csv"
          if official not in data:
            print('AUDIT_RESULT '+json.dumps({'status':'official_csv_unavailable'}))
            sys.exit(0)
          raw=data[official][1].decode('utf-8-sig')
          parsed=[];invalid=[]
          for row in csv.reader(io.StringIO(raw)):
            if not row or len(row)<3:continue
            appid,created,modified=row[:3]
            try:
              c=datetime.datetime.strptime(created.strip(),'%Y-%m-%d %H:%M:%S %z')
              m=datetime.datetime.strptime(modified.strip(),'%Y-%m-%d %H:%M:%S %z')
              cd=max(0,int((today-c).total_seconds()//86400))
              md=max(0,int((today-m).total_seconds()//86400))
              parsed.append({'id':appid.strip(),'created':c.isoformat(),'modified':m.isoformat(),'created_days':cd,'modified_days':md})
            except Exception as e:
              invalid.append(row[:3])
          edges=[0,30,60,90,120,150,180,270,365,540,730,1095,1460,1825,2555,3650]
          def hist(key):
            out=[]
            for lo,hi in zip(edges[:-1],edges[1:]):
              out.append({'range':str(lo)+'-'+str(hi-1),'lo':lo,'hi':hi,'n':sum(lo<=r[key]<hi for r in parsed)})
            out.append({'range':'3650+','lo':3650,'hi':None,'n':sum(r[key]>=3650 for r in parsed)})
            return out
          try:
            official_apps=json.loads(data["https://banglejs.com/apps/apps.json"][1])
            official_ids={a['id'] for a in official_apps if isinstance(a,dict) and 'id' in a}
          except Exception as e:
            official_ids=None
            print('AUDIT_APPS_JSON_INVALID '+str(e))
          if official_ids is not None:
            present=[r for r in parsed if r['id'] in official_ids]
            absent=[r for r in parsed if r['id'] not in official_ids]
          else:
            present=parsed
            absent=[]
          newest=sorted(parsed,key=lambda x:x['modified_days'])[:12]
          created_newest=sorted(parsed,key=lambda x:x['created_days'])[:12]
          obj={'status':'ok','today':today.isoformat(),'date_rows':len(parsed),'invalid_rows':len(invalid),'app_count':len(official_ids) if official_ids is not None else None,'matches_catalog':len(present),'dates_missing_catalog':len(official_ids-set(r['id'] for r in parsed)) if official_ids is not None else None,'rows_not_in_catalog':len(absent),'hist_created':hist('created_days'),'hist_modified':hist('modified_days'),'last_modified_min_days':min((r['modified_days'] for r in parsed),default=None),'newest_modified':newest,'newest_created':created_newest,'updated_within_30d':sum(r['modified_days']<30 for r in parsed),'updated_within_90d':sum(r['modified_days']<90 for r in parsed),'updated_within_180d':sum(r['modified_days']<180 for r in parsed)}
          print('AUDIT_RESULT '+json.dumps(obj,ensure_ascii=False,separators=(',',':')))
          print('AUDIT_CSV_START')
          print('id,created,modified,created_days,modified_days')
          for row in parsed:
            print('{id},{created},{modified},{created_days},{modified_days}'.format(**row))
          print('AUDIT_CSV_END')
          PY
