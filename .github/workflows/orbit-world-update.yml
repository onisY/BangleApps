name: Orbit world location update

on:
  push:
    paths:
      - '.github/workflows/orbit-world-update.yml'
      - 'tools/orbit_world_update.py'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate Orbit world locations
        run: python tools/orbit_world_update.py
      - name: Basic checks
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          p=Path('apps/orbit')
          meta=json.loads((p/'metadata.json').read_text())
          assert meta['version']=='0.38'
          loc=(p/'locations.js').read_text()
          assert 'exports.countries=' in loc and 'exports.prefs=' in loc
          assert 'United Kingdom' in loc and 'Salisbury' in loc and 'Japan' in loc
          app=(p/'app.js').read_text()
          assert 'currentLabel' not in app and 'drawString(currentLabel' not in app
          assert 'Bangle.on("touch"' not in app and 'Bangle.on("drag"' not in app
          assert 'getUTCHours' in app
          settings=(p/'settings.js').read_text()
          assert '"Country"' in settings and 'countryName' in settings
          print('Checks passed')
          PY
      - name: Commit generated Orbit v0.38 files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/orbit/locations.js apps/orbit/settings.js apps/orbit/settings.min.js apps/orbit/app.js apps/orbit/app.min.js apps/orbit/app.wrapper.js apps/orbit/metadata.json apps/orbit/README.md
          git commit -m 'Expand Orbit locations worldwide and remove NOW label'
          git push origin HEAD:master
