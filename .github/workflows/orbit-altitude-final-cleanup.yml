name: Orbit altitude final cleanup

on:
  push:
    paths:
      - '.github/workflows/orbit-altitude-final-cleanup.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Remove stale app altitude block
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          p=Path('apps/orbit')
          ap=p/'app.js'; s=ap.read_text()
          old='''  if(settings.locationMode!==1 && settings.locPref==="Tokyo" &&\n     settings.locName==="Chiyoda-ku" && (!isFinite(settings.elevationM) || settings.elevationM===0)){\n    Storage.writeJSON(FILE,settings);\n  }\n'''
          assert old in s
          s=s.replace(old,'',1)
          ap.write_text(s)

          def strip_comments(src):
            out=[];i=0;state='code';q=''
            while i<len(src):
              ch=src[i];n=src[i+1] if i+1<len(src) else ''
              if state=='code':
                if ch in "'\"`":state='str';q=ch;out.append(ch);i+=1;continue
                if ch=='/' and n=='/':state='line';i+=2;continue
                if ch=='/' and n=='*':state='block';i+=2;continue
                out.append(ch);i+=1;continue
              if state=='str':
                out.append(ch)
                if ch=='\\' and i+1<len(src):out.append(src[i+1]);i+=2;continue
                if ch==q:state='code'
                i+=1;continue
              if state=='line':
                if ch=='\n':out.append('\n');state='code'
                i+=1;continue
              if state=='block':
                if ch=='*' and n=='/':state='code';i+=2;continue
                i+=1
            return ''.join(out)
          def mini(src):
            src=strip_comments(src);out=[];i=0;state='code';q='';pending=False
            def word(c):return bool(c) and (c.isalnum() or c in '_$')
            while i<len(src):
              ch=src[i]
              if state=='code':
                if ch in "'\"`":
                  if pending:
                    prev=out[-1] if out else ''
                    if word(prev):out.append(' ')
                    pending=False
                  state='str';q=ch;out.append(ch);i+=1;continue
                if ch.isspace():pending=True;i+=1;continue
                if pending:
                  prev=out[-1] if out else ''
                  if (word(prev) and word(ch)) or (prev=='+' and ch=='+') or (prev=='-' and ch=='-'):out.append(' ')
                  pending=False
                out.append(ch);i+=1;continue
              out.append(ch)
              if ch=='\\' and i+1<len(src):out.append(src[i+1]);i+=2;continue
              if ch==q:state='code'
              i+=1
            return ''.join(out).strip()+'\n'
          (p/'app.min.js').write_text(mini(s))
          mp=p/'metadata.json';meta=json.loads(mp.read_text());meta['version']='0.49';mp.write_text(json.dumps(meta,indent=2,ensure_ascii=False)+'\n')
          rp=p/'README.md';rp.write_text(rp.read_text()+'''\n\n## Version 0.49 altitude cleanup\n\n- Removed the final obsolete runtime altitude reference left from the old Tokyo-default migration.\n- Altitude/elevation is now absent from all runtime location calculations, location displays and location databases.\n- Only the one-time legacy-key deletion remains so watches upgrading from older Orbit versions can purge old altitude fields from `orbit.json`.\n''')
          PY
      - name: Validate
        run: |
          node --check apps/orbit/app.js
          node --check apps/orbit/app.min.js
          node --check apps/orbit/settings.js
          node --check apps/orbit/settings.min.js
          python - <<'PY'
          import json,re
          from pathlib import Path
          p=Path('apps/orbit')
          app=(p/'app.js').read_text(); st=(p/'settings.js').read_text()
          # Any remaining altitude-key mentions must be limited to legacy deletion blocks.
          for txt,name in [(app,'app.js'),(st,'settings.js')]:
            lines=[x.strip() for x in txt.splitlines() if 'elevationM' in x or 'manualElevationM' in x]
            assert len(lines)<=2,(name,lines)
            assert all(('delete ' in x) or x.startswith('if(') for x in lines),(name,lines)
          for bad in ['fix.alt','gpsAltSamples','GPS_ALT_SAMPLE_MS','Math.round(loc.elevationM)','Math.round(s.elevationM)','Elevation m','Alt samples','Alt wait','p[3]']:
            assert bad not in app+st,bad
          loc=(p/'locations.js').read_text();num=r'-?\d+(?:\.\d+)?'
          assert not re.search(r'\["(?:\\.|[^"\\])*",'+num+r','+num+r','+num+r'\]',loc)
          assert json.loads((p/'metadata.json').read_text())['version']=='0.49'
          print('Orbit v0.49 final altitude cleanup passed')
          PY
      - name: Commit Orbit v0.49
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+onisY@users.noreply.github.com'
          git add apps/orbit/app.js apps/orbit/app.min.js apps/orbit/metadata.json apps/orbit/README.md
          git commit -m 'Finish removing altitude from Orbit'
          git push origin HEAD:master
