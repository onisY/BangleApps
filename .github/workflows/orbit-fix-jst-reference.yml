name: Orbit JST reference fix

on:
  push:
    paths:
      - '.github/workflows/orbit-fix-jst-reference.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch Orbit solar rotation to JST reference
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          p=Path('apps/orbit')
          app=p/'app.js'
          s=app.read_text()

          old='''    // UTC-based apparent solar time works for any selected world longitude.\n    // Date.valueOf() is absolute Unix time and is independent of the\n    // watch's configured timezone.  Take its position within the UTC day.\n    var utcMin=(((date.valueOf()%DAY)+DAY)%DAY)/60000;\n    var solarMin=utcMin + 4*loc.lon + eot;'''
          new='''    // The Orbit header/watch clock is kept in Japan Standard Time.\n    // Convert that civil JST time to apparent solar time at the selected\n    // longitude. JST's standard meridian is 135 deg E.\n    var civilMin=date.getHours()*60+date.getMinutes()+date.getSeconds()/60;\n    var solarMin=civilMin + 4*(loc.lon-135) + eot;'''
          assert old in s, 'v0.41 solar-time block not found'
          s=s.replace(old,new,1)

          # Solar-event times are also expressed on the watch's JST clock.
          s=s.replace('var stdLon=deviceTzHours*15;','var stdLon=135;',1)

          # Remove device timezone variables if still present and unused.
          s=re.sub(r'  var systemSettings=Storage\.readJSON\("setting\.json",1\)\|\|\{\};\n  var deviceTzHours=.*?;\n','',s,count=1)
          app.write_text(s)

          # Regenerate lightweight app.min.js.
          def strip_comments(src):
            out=[];i=0;state='code';q=''
            while i<len(src):
              ch=src[i];n=src[i+1] if i+1<len(src) else ''
              if state=='code':
                if ch in "'\"`": state='str';q=ch;out.append(ch);i+=1;continue
                if ch=='/' and n=='/': state='line';i+=2;continue
                if ch=='/' and n=='*': state='block';i+=2;continue
                out.append(ch);i+=1;continue
              if state=='str':
                out.append(ch)
                if ch=='\\' and i+1<len(src):out.append(src[i+1]);i+=2;continue
                if ch==q:state='code'
                i+=1;continue
              if state=='line':
                if ch=='\n':out.append('\n');state='code'
                i+=1;continue
              if state=='block':
                if ch=='*' and n=='/':state='code';i+=2;continue
                i+=1
            return ''.join(out)
          def mini(src):
            src=strip_comments(src);out=[];i=0;state='code';q='';pending=False
            def word(c):return bool(c) and (c.isalnum() or c in '_$')
            while i<len(src):
              ch=src[i]
              if state=='code':
                if ch in "'\"`":
                  if pending:
                    prev=out[-1] if out else ''
                    if word(prev):out.append(' ')
                    pending=False
                  state='str';q=ch;out.append(ch);i+=1;continue
                if ch.isspace():pending=True;i+=1;continue
                if pending:
                  prev=out[-1] if out else ''
                  if (word(prev) and word(ch)) or (prev=='+' and ch=='+') or (prev=='-' and ch=='-'):out.append(' ')
                  pending=False
                out.append(ch);i+=1;continue
              out.append(ch)
              if ch=='\\' and i+1<len(src):out.append(src[i+1]);i+=2;continue
              if ch==q:state='code'
              i+=1
            return ''.join(out).strip()+'\n'
          (p/'app.min.js').write_text(mini(s))

          meta_path=p/'metadata.json'
          meta=json.loads(meta_path.read_text())
          meta['version']='0.42'
          meta_path.write_text(json.dumps(meta,indent=2,ensure_ascii=False)+'\n')

          readme=p/'README.md'
          readme.write_text(readme.read_text()+'''\n\n## Version 0.42 JST-reference world-location fix\n\n- Fixed the remaining world-location Earth-rotation error seen with Italy / Rome.\n- The Orbit header/watch clock is treated as Japan Standard Time (JST), matching the actual watch display used by this build.\n- Apparent solar time is now computed as watch civil time + 4 minutes × (selected longitude - 135°E) + equation of time.\n- This restores the previously correct Japan behavior while allowing any selected world longitude.\n- Solar-event times use the same 135°E JST reference.\n''')
          PY
      - name: Verify Rome and Tokyo reference cases
        run: |
          python - <<'PY'
          import json,math
          from pathlib import Path
          p=Path('apps/orbit')
          a=(p/'app.js').read_text();m=(p/'app.min.js').read_text()
          assert '4*(loc.lon-135)' in a
          assert 'date.valueOf()%DAY' not in a
          assert 'deviceTzHours' not in a
          assert json.loads((p/'metadata.json').read_text())['version']=='0.42'
          # 2026-09-14 around 23:19 JST
          n=257;b=2*math.pi*(n-81)/364
          eot=9.87*math.sin(2*b)-7.53*math.cos(b)-1.5*math.sin(b)
          civil=23*60+19
          rome=(civil+4*(12.48-135)+eot)%1440
          tokyo=(civil+4*(139.754-135)+eot)%1440
          assert 900 < rome < 930, rome      # around 15:10 JST-derived local solar time
          assert 1400 < tokyo < 1440, tokyo  # around 23:43 local solar time
          print('Rome solar min',rome,'Tokyo solar min',tokyo)
          PY
      - name: Commit Orbit v0.42
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/orbit/app.js apps/orbit/app.min.js apps/orbit/metadata.json apps/orbit/README.md
          git commit -m 'Fix Orbit world rotation using JST standard meridian'
          git push origin HEAD:master
