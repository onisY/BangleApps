name: Orbit absolute UTC rotation fix

on:
  push:
    paths:
      - '.github/workflows/orbit-fix-device-timezone.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch Earth rotation to absolute UTC
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('apps/orbit')
          app_path=p/'app.js'
          s=app_path.read_text()
          old='''    var utcMin=date.getHours()*60+date.getMinutes()+date.getSeconds()/60-deviceTzHours*60;\n    utcMin=((utcMin%1440)+1440)%1440;'''
          new='''    // Date.valueOf() is absolute Unix time and is independent of the\n    // watch's configured timezone.  Take its position within the UTC day.\n    var utcMin=(((date.valueOf()%DAY)+DAY)%DAY)/60000;'''
          assert old in s
          s=s.replace(old,new,1)
          app_path.write_text(s)

          # Regenerate installed minified runtime.
          def strip_comments(src):
            out=[];i=0;state='code';q=''
            while i<len(src):
              ch=src[i];n=src[i+1] if i+1<len(src) else ''
              if state=='code':
                if ch in "'\"`": state='str';q=ch;out.append(ch);i+=1;continue
                if ch=='/' and n=='/': state='line';i+=2;continue
                if ch=='/' and n=='*': state='block';i+=2;continue
                out.append(ch);i+=1;continue
              if state=='str':
                out.append(ch)
                if ch=='\\' and i+1<len(src): out.append(src[i+1]);i+=2;continue
                if ch==q: state='code'
                i+=1;continue
              if state=='line':
                if ch=='\n': out.append('\n');state='code'
                i+=1;continue
              if state=='block':
                if ch=='*' and n=='/': state='code';i+=2;continue
                i+=1
            return ''.join(out)
          def mini(src):
            src=strip_comments(src);out=[];i=0;state='code';q='';pending=False
            def word(c): return bool(c) and (c.isalnum() or c in '_$')
            while i<len(src):
              ch=src[i]
              if state=='code':
                if ch in "'\"`":
                  if pending:
                    prev=out[-1] if out else ''
                    if word(prev):out.append(' ')
                    pending=False
                  state='str';q=ch;out.append(ch);i+=1;continue
                if ch.isspace():pending=True;i+=1;continue
                if pending:
                  prev=out[-1] if out else ''
                  if (word(prev) and word(ch)) or (prev=='+' and ch=='+') or (prev=='-' and ch=='-'):out.append(' ')
                  pending=False
                out.append(ch);i+=1;continue
              out.append(ch)
              if ch=='\\' and i+1<len(src):out.append(src[i+1]);i+=2;continue
              if ch==q:state='code'
              i+=1
            return ''.join(out).strip()+'\n'
          (p/'app.min.js').write_text(mini(s))

          meta_path=p/'metadata.json'
          meta=json.loads(meta_path.read_text())
          meta['version']='0.41'
          meta_path.write_text(json.dumps(meta,indent=2,ensure_ascii=False)+'\n')

          readme=p/'README.md'
          readme.write_text(readme.read_text()+'''\n\n## Version 0.41 absolute-UTC Earth rotation\n\n- Earth/observer rotation now derives UTC directly from `Date.valueOf()` (Unix time modulo one UTC day).\n- This removes any dependence on `Date.getTimezoneOffset()` or the watch's timezone setting for the on-screen astronomical rotation.\n- Example sanity check: at 22:35 JST, Rome is approximately 14:30 apparent solar time, rather than near midnight.\n- The header still displays the Bangle's normal civil clock time.\n''')
          PY
      - name: Verify absolute-time calculation
        run: |
          python - <<'PY'
          import json,math,datetime
          from pathlib import Path
          p=Path('apps/orbit')
          a=(p/'app.js').read_text();m=(p/'app.min.js').read_text()
          assert '(((date.valueOf()%DAY)+DAY)%DAY)/60000' in a
          assert 'date.valueOf()%DAY' in m
          assert json.loads((p/'metadata.json').read_text())['version']=='0.41'
          # 2026-09-14 22:35 JST = 13:35 UTC. Rome longitude ~12.496E.
          utc=13*60+35
          n=257;b=2*math.pi*(n-81)/364
          eot=9.87*math.sin(2*b)-7.53*math.cos(b)-1.5*math.sin(b)
          solar=(utc+4*12.496+eot)%1440
          assert 840 < solar < 900,solar
          print('Rome apparent solar time minutes:',solar)
          print('Orbit v0.41 checks passed')
          PY
      - name: Commit Orbit v0.41
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/orbit/app.js apps/orbit/app.min.js apps/orbit/metadata.json apps/orbit/README.md
          git commit -m 'Use absolute UTC for Orbit Earth rotation'
          git push origin HEAD:master
