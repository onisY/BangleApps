name: Orbit device timezone fix

on:
  push:
    paths:
      - '.github/workflows/orbit-fix-device-timezone.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch Orbit timezone source
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('apps/orbit')

          # Read the Bangle's configured civil timezone once at Orbit startup.
          # This is more reliable on older firmware than Date.getTimezoneOffset()
          # for watches whose displayed civil time is already correct.
          app_path=p/'app.js'
          s=app_path.read_text()
          anchor='  var Storage = require("Storage");\n  var FILE = "orbit.json";'
          repl='  var Storage = require("Storage");\n  var FILE = "orbit.json";\n  var systemSettings=Storage.readJSON("setting.json",1)||{};\n  var deviceTzHours=isFinite(systemSettings.timezone)?systemSettings.timezone:(-new Date().getTimezoneOffset()/60);'
          assert anchor in s
          s=s.replace(anchor,repl,1)

          old='''    var utcMin=date.getHours()*60+date.getMinutes()+date.getSeconds()/60+date.getTimezoneOffset();\n    utcMin=((utcMin%1440)+1440)%1440;'''
          new='''    var utcMin=date.getHours()*60+date.getMinutes()+date.getSeconds()/60-deviceTzHours*60;\n    utcMin=((utcMin%1440)+1440)%1440;'''
          assert old in s
          s=s.replace(old,new,1)

          old2='''    // Device civil timezone. Japan gives 135E automatically:\n    // getTimezoneOffset()=-540 min -> standard meridian=135 deg E.\n    var stdLon=-noonDate.getTimezoneOffset()/4;'''
          new2='''    // Use the Bangle's configured civil timezone. In Japan, timezone=9\n    // gives the JST standard meridian 135 deg E.\n    var stdLon=deviceTzHours*15;'''
          assert old2 in s
          s=s.replace(old2,new2,1)
          app_path.write_text(s)

          # Regenerate minified runtime from the readable source.
          def strip_comments(src):
            out=[];i=0;state='code';q=''
            while i<len(src):
              ch=src[i];n=src[i+1] if i+1<len(src) else ''
              if state=='code':
                if ch in "'\"`": state='str';q=ch;out.append(ch);i+=1;continue
                if ch=='/' and n=='/': state='line';i+=2;continue
                if ch=='/' and n=='*': state='block';i+=2;continue
                out.append(ch);i+=1;continue
              if state=='str':
                out.append(ch)
                if ch=='\\' and i+1<len(src): out.append(src[i+1]);i+=2;continue
                if ch==q: state='code'
                i+=1;continue
              if state=='line':
                if ch=='\n': out.append('\n');state='code'
                i+=1;continue
              if state=='block':
                if ch=='*' and n=='/': state='code';i+=2;continue
                i+=1
            return ''.join(out)
          def mini(src):
            src=strip_comments(src);out=[];i=0;state='code';q='';pending=False
            def word(c): return bool(c) and (c.isalnum() or c in '_$')
            while i<len(src):
              ch=src[i]
              if state=='code':
                if ch in "'\"`":
                  if pending:
                    prev=out[-1] if out else ''
                    if word(prev):out.append(' ')
                    pending=False
                  state='str';q=ch;out.append(ch);i+=1;continue
                if ch.isspace():pending=True;i+=1;continue
                if pending:
                  prev=out[-1] if out else ''
                  if (word(prev) and word(ch)) or (prev=='+' and ch=='+') or (prev=='-' and ch=='-'):out.append(' ')
                  pending=False
                out.append(ch);i+=1;continue
              out.append(ch)
              if ch=='\\' and i+1<len(src):out.append(src[i+1]);i+=2;continue
              if ch==q:state='code'
              i+=1
            return ''.join(out).strip()+'\n'
          (p/'app.min.js').write_text(mini(s))

          meta_path=p/'metadata.json'
          meta=json.loads(meta_path.read_text())
          meta['version']='0.40'
          meta_path.write_text(json.dumps(meta,indent=2,ensure_ascii=False)+'\n')

          readme=p/'README.md'
          readme.write_text(readme.read_text()+'''\n\n## Version 0.40 device-timezone correction\n\n- Fixed an approximately half-day Earth/observer rotation error seen with world locations (for example Italy / Rome).\n- Orbit now uses the Bangle system `setting.json` timezone value as the authoritative civil-time offset instead of relying on `Date.getTimezoneOffset()` at runtime.\n- UTC for Earth rotation is computed as displayed civil time minus the configured device timezone.\n- Sunrise/sunset/noon event calculations use the same timezone source.\n- The top header remains the Bangle's own civil clock time; selecting a world location changes the astronomical location, not the watch's system timezone.\n''')
          PY
      - name: Verify calculations and source
        run: |
          python - <<'PY'
          import json, math
          from pathlib import Path
          p=Path('apps/orbit')
          a=(p/'app.js').read_text(); m=(p/'app.min.js').read_text()
          for s in (a,m):
            assert 'deviceTzHours' in s
            assert 'getUTCHours' not in s
            assert 'date.getTimezoneOffset()' not in s
          assert 'var stdLon=deviceTzHours*15;' in a
          assert json.loads((p/'metadata.json').read_text())['version']=='0.40'

          # Sanity check: at 22:35 JST, Rome longitude 12.496E should be
          # about 14:30 apparent solar time in mid-September, not midnight.
          local_min=22*60+35
          utc=(local_min-9*60)%1440
          n=257
          b=2*math.pi*(n-81)/364
          eot=9.87*math.sin(2*b)-7.53*math.cos(b)-1.5*math.sin(b)
          solar=(utc+4*12.496+eot)%1440
          assert 840 < solar < 900, solar
          print('Rome apparent solar minutes:',solar)
          print('Orbit v0.40 checks passed')
          PY
      - name: Commit Orbit v0.40
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/orbit/app.js apps/orbit/app.min.js apps/orbit/metadata.json apps/orbit/README.md
          git commit -m 'Fix Orbit world-location time rotation using device timezone'
          git push origin HEAD:master
