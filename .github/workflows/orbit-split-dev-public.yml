name: Orbit split validation

on:
  push:
    paths:
      - '.github/workflows/orbit-split-dev-public.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 18.x
      - name: Validate Orbit and Orbit Dev syntax and metadata
        run: |
          node --check apps/orbit/app.js
          node --check apps/orbit/app.min.js
          node --check apps/orbit/settings.js
          node --check apps/orbit/settings.min.js
          node --check apps/orbit_dev/app.js
          node --check apps/orbit_dev/app.min.js
          node --check apps/orbit_dev/settings.js
          node --check apps/orbit_dev/settings.min.js
          node - <<'NODE'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync('apps/orbit/metadata.json'));
          const d=JSON.parse(fs.readFileSync('apps/orbit_dev/metadata.json'));
          if(p.id!=='orbit'||p.version!=='0.01') throw new Error('public metadata mismatch');
          if(d.id!=='orbit_dev'||d.version!=='0.51') throw new Error('dev metadata mismatch');
          const names=d.storage.map(x=>x.name).sort().join(',');
          const expected=['orbit_dev.app.js','orbit_dev.core.js','orbit_dev.img','orbit_dev.settings.js','orbit_devloc'].sort().join(',');
          if(names!==expected) throw new Error('dev storage collision risk');
          NODE
      - name: Install dependencies
        run: npm ci
      - name: Run BangleApps test suite
        run: npm test
