name: Orbit GPS/manual label layout update

on:
  push:
    paths:
      - '.github/workflows/orbit-location-labels.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch location readout layout
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('apps/orbit')
          app=p/'app.js'
          s=app.read_text()

          marker='''  function draw(){\n'''
          helper='''  function coordText(v,pos,neg){\n    return Math.abs(v).toFixed(4)+(v<0?neg:pos);\n  }\n  function circleRectHit(cx,cy,r,x0,y0,x1,y1){\n    var qx=clamp(cx,x0,x1),qy=clamp(cy,y0,y1);\n    var dx=cx-qx,dy=cy-qy,rr=r+2;\n    return dx*dx+dy*dy<=rr*rr;\n  }\n  function drawLocationReadout(mx,my){\n    g.setFont("6x8",1);\n    if(settings.locationMode===0){\n      g.setColor(C.fg).setFontAlign(1,0);\n      g.drawString(loc.pref,W-1,H-17);\n      g.drawString(loc.name,W-1,H-8);\n      return;\n    }\n\n    var lines=[\n      settings.locationMode===2?"GPS":"manual",\n      coordText(loc.lat,"N","S"),\n      coordText(loc.lon,"E","W"),\n      Math.round(loc.elevationM)+"m"\n    ];\n    // Longest coordinate is 9 glyphs at 6 px = 54 px. Keep this narrow\n    // right-side column outside the fixed Earth as much as possible.\n    var x1=W-1,x0=x1-53,blockH=35;\n    var ys=[H-blockH,H-blockH-36,76],y0=ys[0];\n    for(var i=0;i<ys.length;i++){\n      var yy=ys[i],safe=true;\n      if(circleRectHit(mx,my,settings.moonSize+1,x0,yy,x1,yy+blockH-1))safe=false;\n      if(circleRectHit(EX,EY,settings.earthSize+1,x0,yy,x1,yy+blockH-1))safe=false;\n      if(circleRectHit(SX,SY,settings.sunSize+5,x0,yy,x1,yy+blockH-1))safe=false;\n      if(safe){y0=yy;break;}\n    }\n    // Clear only the chosen safe label box so orbit/ray lines cannot make\n    // coordinates hard to read. The box has already been checked against\n    // Sun/Earth/Moon before erasing.\n    g.setColor(C.bg).fillRect(x0-1,y0-1,x1,y0+blockH);\n    g.setColor(C.fg).setFontAlign(1,-1);\n    for(var j=0;j<lines.length;j++)g.drawString(lines[j],x1,y0+j*9);\n  }\n\n  function draw(){\n'''
          assert marker in s
          s=s.replace(marker,helper,1)

          old='''    g.setColor(C.fg).setFont("6x8",1).setFontAlign(1,0);\n    if(settings.locationMode!==0){\n      g.drawString("Lat "+loc.lat.toFixed(4),W-1,H-26);\n      g.drawString("Lon "+loc.lon.toFixed(4),W-1,H-17);\n      g.drawString("Alt "+Math.round(loc.elevationM)+"m",W-1,H-8);\n    } else {\n      g.drawString(loc.pref,W-1,H-17);\n      g.drawString(loc.name,W-1,H-8);\n    }'''
          new='''    drawLocationReadout(mx,my);'''
          assert old in s
          s=s.replace(old,new,1)
          app.write_text(s)

          def strip_comments(src):
            out=[];i=0;state='code';q=''
            while i<len(src):
              ch=src[i];n=src[i+1] if i+1<len(src) else ''
              if state=='code':
                if ch in "'\"`":state='str';q=ch;out.append(ch);i+=1;continue
                if ch=='/' and n=='/':state='line';i+=2;continue
                if ch=='/' and n=='*':state='block';i+=2;continue
                out.append(ch);i+=1;continue
              if state=='str':
                out.append(ch)
                if ch=='\\' and i+1<len(src):out.append(src[i+1]);i+=2;continue
                if ch==q:state='code'
                i+=1;continue
              if state=='line':
                if ch=='\n':out.append('\n');state='code'
                i+=1;continue
              if state=='block':
                if ch=='*' and n=='/':state='code';i+=2;continue
                i+=1
            return ''.join(out)
          def mini(src):
            src=strip_comments(src);out=[];i=0;state='code';q='';pending=False
            def word(c):return bool(c) and (c.isalnum() or c in '_$')
            while i<len(src):
              ch=src[i]
              if state=='code':
                if ch in "'\"`":
                  if pending:
                    prev=out[-1] if out else ''
                    if word(prev):out.append(' ')
                    pending=False
                  state='str';q=ch;out.append(ch);i+=1;continue
                if ch.isspace():pending=True;i+=1;continue
                if pending:
                  prev=out[-1] if out else ''
                  if (word(prev) and word(ch)) or (prev=='+' and ch=='+') or (prev=='-' and ch=='-'):out.append(' ')
                  pending=False
                out.append(ch);i+=1;continue
              out.append(ch)
              if ch=='\\' and i+1<len(src):out.append(src[i+1]);i+=2;continue
              if ch==q:state='code'
              i+=1
            return ''.join(out).strip()+'\n'
          (p/'app.min.js').write_text(mini(s))

          meta_path=p/'metadata.json'
          meta=json.loads(meta_path.read_text())
          meta['version']='0.46'
          meta_path.write_text(json.dumps(meta,indent=2,ensure_ascii=False)+'\n')

          readme=p/'README.md'
          readme.write_text(readme.read_text()+'''\n\n## Version 0.46 GPS/manual location readout\n\n- GPS and Manual locations now show a compact four-line readout on the right side: mode, latitude, longitude and altitude.\n- Coordinates use hemisphere suffixes, for example `35.6940N` and `139.7540E`.\n- The normal position is the lower-right corner. If the Moon occupies that area, the readout automatically moves upward to the nearest safe right-side slot.\n- Sun, Earth and Moon circles are checked against the label rectangle before drawing, preventing the location text from being placed over a celestial body.\n- Place mode keeps the existing two-line region/place display.\n''')
          PY
      - name: Validate
        run: |
          node --check apps/orbit/app.js
          node --check apps/orbit/app.min.js
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('apps/orbit')
          a=(p/'app.js').read_text();m=(p/'app.min.js').read_text()
          for x in (a,m):
            assert 'drawLocationReadout' in x
            assert 'circleRectHit' in x
            assert 'settings.locationMode===2?"GPS":"manual"' in x
            assert 'coordText(loc.lat,"N","S")' in x
            assert 'coordText(loc.lon,"E","W")' in x
          assert json.loads((p/'metadata.json').read_text())['version']=='0.46'
          print('Orbit v0.46 location label checks passed')
          PY
      - name: Commit Orbit v0.46
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+onisY@users.noreply.github.com'
          git add apps/orbit/app.js apps/orbit/app.min.js apps/orbit/metadata.json apps/orbit/README.md
          git commit -m 'Improve Orbit GPS and manual location readout'
          git push origin HEAD:master
