name: Validate tenkyu v0.111 nonwear HRM recovery
on:
  push:
    branches:
      - fix/tenkyu-v0111-hrm-probe-retry
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '18'
      - name: Run eclipse and rest regression suite
        run: node apps/orbit/test.js
